<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%">
  <defs>
    <!-- Gold Leaf Gradient -->
    <radialGradient id="annaGoldBg" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Anna Halo -->
    <radialGradient id="annaHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Infant Mary Halo -->
    <radialGradient id="maryHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Wood Base -->
    <linearGradient id="annaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261208" />
      <stop offset="100%" stop-color="#120602" />
    </linearGradient>

    <!-- Maternal Cinnabar Red Maphorion -->
    <linearGradient id="annaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#B91C1C" />
      <stop offset="80%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>

    <!-- Forest Green Chiton -->
    <linearGradient id="annaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Young Mary Blue Maphorion -->
    <linearGradient id="maryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- Wood Base -->
  <rect width="360" height="480" fill="url(#annaWood)" rx="16" />

  <!-- Outer Carved Bevel & Kovcheg Red Inset Border -->
  <rect x="6" y="6" width="348" height="468" fill="none" stroke="#D4AF37" stroke-width="3" rx="12" />
  <rect x="12" y="12" width="336" height="456" fill="none" stroke="#B91C1C" stroke-width="1.8" rx="8" />

  <!-- Gold Leaf Background -->
  <rect x="15" y="15" width="330" height="450" fill="url(#annaGoldBg)" rx="6" />

  <!-- Corner Crosses -->
  <g fill="#92400E" opacity="0.6">
    <text x="24" y="34" font-family="serif" font-size="16" font-weight="bold">☦</text>
    <text x="324" y="34" font-family="serif" font-size="16" font-weight="bold">☦</text>
  </g>

  <!-- Greek Byzantine Inscriptions -->
  <g font-family="'Cinzel', Georgia, serif" font-weight="bold" text-anchor="middle">
    <rect x="70" y="24" width="220" height="22" rx="11" fill="#78350F" opacity="0.88" />
    <text x="180" y="39" fill="#FEF08A" font-size="11" letter-spacing="2">Η ΑΓΙΑ ΑΝΝΑ</text>
    <text x="180" y="58" fill="#78350F" font-size="8.5" letter-spacing="1">Η ΘΕΟΠΡΟΜΗΤΩΡ • ΜΗΤΗΡ ΤΗC ΘΕΟΤΟΚΟΥ</text>
  </g>

  <!-- SAINT ANNA HALO -->
  <circle cx="160" cy="142" r="58" fill="url(#annaHalo)" stroke="#FFFBEB" stroke-width="2.2" />
  <circle cx="160" cy="142" r="54" fill="none" stroke="#B45309" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Saint Anna Robes -->
  <!-- Inner Chiton -->
  <path d="M120 190 L120 435 L200 435 L200 190 Z" fill="url(#annaGreen)" />

  <!-- Outer Cinnabar Red Maphorion -->
  <path d="M160 94 C125 94 105 125 95 170 C85 215 75 290 65 435 L255 435 C245 290 235 215 225 170 C215 125 195 94 160 94 Z" fill="url(#annaRed)" stroke="#FDE047" stroke-width="1.5" />

  <!-- Anna Face & Tender Maternal Features -->
  <path d="M152 165 L152 188 L168 188 L168 165 Z" fill="#E2A676" />
  <ellipse cx="160" cy="144" rx="20" ry="24" fill="#F4C59E" stroke="#A76137" stroke-width="1" />
  <ellipse cx="160" cy="146" rx="17" ry="20" fill="#FADBC2" />

  <!-- Maternal Eyes looking down toward Mary with deep love -->
  <ellipse cx="153" cy="143" rx="3.2" ry="2" fill="#2E1C0C" />
  <circle cx="154" cy="142.5" r="0.7" fill="#FFFFFF" />
  <ellipse cx="167" cy="143" rx="3.2" ry="2" fill="#2E1C0C" />
  <circle cx="168" cy="142.5" r="0.7" fill="#FFFFFF" />
  <!-- Eyebrows -->
  <path d="M148 139 Q153 137 158 140" stroke="#78350F" stroke-width="1.2" fill="none" />
  <path d="M162 140 Q167 137 172 139" stroke="#78350F" stroke-width="1.2" fill="none" />
  <!-- Nose & Gentle Lips -->
  <path d="M159 140 L160 152 L163 152" stroke="#9A3412" stroke-width="1" fill="none" />
  <path d="M156 158 Q160 160 164 158" stroke="#B91C1C" stroke-width="1.4" fill="none" stroke-linecap="round" />

  <!-- Anna's Maternal Arms Embracing the Child Mary -->
  <path d="M120 220 Q140 280 180 290 Q220 280 230 220" fill="url(#annaRed)" stroke="#FDE047" stroke-width="1" />

  <!-- ================= THE CHILD VIRGIN MARY (IN ANNA'S ARMS) ================= -->
  <g id="child-mary">
    <!-- Mary's Halo -->
    <circle cx="230" cy="240" r="34" fill="url(#maryHalo)" stroke="#FFFBEB" stroke-width="1.8" />
    <circle cx="230" cy="240" r="31" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

    <!-- Inscription for Mary: ΜΡ ΘΥ (Mother of God) -->
    <text x="230" y="200" fill="#78350F" font-family="'Cinzel', serif" font-size="8" font-weight="bold" text-anchor="middle">ΜΡ ΘΥ</text>

    <!-- Child Mary Maphorion (Lapis Blue) -->
    <path d="M210 265 Q230 255 250 265 L260 410 L200 410 Z" fill="url(#maryBlue)" stroke="#FDE047" stroke-width="1.2" />

    <!-- Gold Star on Child Mary's Forehead -->
    <path d="M230 230 L231 233 L234 234 L231 235 L230 238 L229 235 L226 234 L229 233 Z" fill="#FDE047" />

    <!-- Child Mary Face -->
    <ellipse cx="230" cy="242" rx="14" ry="17" fill="#FCE7D4" stroke="#A76137" stroke-width="0.8" />
    <!-- Innocent, Holy Eyes -->
    <ellipse cx="225" cy="241" rx="2.2" ry="1.5" fill="#2E1C0C" />
    <ellipse cx="235" cy="241" rx="2.2" ry="1.5" fill="#2E1C0C" />
    <path d="M230 239 L230 247 L232 247" stroke="#9A3412" stroke-width="0.8" fill="none" />
    <path d="M227 251 Q230 253 233 251" stroke="#DC2626" stroke-width="1" fill="none" stroke-linecap="round" />

    <!-- Hands in Prayer or Holding Lily -->
    <ellipse cx="230" cy="285" rx="6" ry="7" fill="#FCE7D4" />
    <path d="M230 275 L230 295" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Plaque -->
  <rect x="35" y="442" width="290" height="20" rx="10" fill="#78350F" opacity="0.95" stroke="#D4AF37" stroke-width="1" />
  <text x="180" y="456" fill="#FEF08A" font-family="'Cinzel', serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ST. ANNA • THE ANCESTOR OF GOD &amp; MOTHER OF MARY
  </text>
</svg>
